name: Build and test Group16-DevNexus

on:
  push:
    branches: [ "main", "develop", "release", "feature/view-record" ]
  pull_request:
    branches: [ "main", "develop", "release" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DB_PASSWORD: Kzh123!@#
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: Kzh123!@#
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Import test database
        env:
          MYSQL_CONTAINER_ID: ${{ job.services.mysql.id }}
        run: |
          docker exec -i -e MYSQL_PWD="$DB_PASSWORD" "$MYSQL_CONTAINER_ID" \
            mysql -uroot < src/test/resources/world.sql

      - name: Build with Maven
        run: mvn --batch-mode clean package

      - name: Run Docker Compose
        run: docker compose up --build --abort-on-container-exit --exit-code-from app

      - name: Clean up
        if: always()
        run: docker compose down -v
